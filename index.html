<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>つたえるVOCA 12</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:white;gap:8px}h1{font-size:clamp(18px,3vw,28px);margin:0}button{font:inherit;cursor:pointer}.stop{border:0;border-radius:12px;background:#e9edf4;padding:10px 16px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:10px}.card{background:white;border:5px solid var(--border);border-radius:15px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;padding:0;box-shadow:0 2px 5px #0001;touch-action:manipulation}.card:active,.card.playing{background:#fff6c9;transform:scale(.98)}.card img{display:block;width:100%;height:auto;pointer-events:none}.card .fallback{display:none;padding:16px 6px;font-size:clamp(16px,2.1vw,25px);font-weight:800;white-space:pre-line;text-align:center;line-height:1.4}.card img:not([src])+.fallback{display:block}.status{padding:0 16px 12px;color:#555;font-size:13px}@media (orientation:portrait){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (min-width:700px) and (orientation:landscape){.grid{height:calc(100dvh - 100px);grid-template-rows:repeat(2,minmax(0,1fr))}.card img{height:100%;object-fit:contain}}</style></head><body><header><h1>つたえる VOCA</h1><button class="stop" id="stop">音をとめる</button></header><main class="grid" id="grid"></main><div class="status" id="status" aria-live="polite">カードをおすと、ことばが出ます。</div><script>
const cards=[['絵でかいてください','#f6a8c7'],['手話で話してください','#f5d96b'],['ゆっくり話してください','#80acee'],['はっきり話してください','#a5dd7c'],['近くで話してください','#f5d96b'],['大きな声で話してください','#cda8e6'],['もう一度言ってください','#86d5ed'],['顔を見て話してください','#a5dd7c'],['おはなしがむずかしいです','#f6a8c7'],['かんたんに話してください','#86d5ed'],['書いてください','#a5dd7c'],['やさしいことばで話してください','#cda8e6']];
const grid=document.getElementById('grid');const status=document.getElementById('status');let active=null;
function speak(text,button){speechSynthesis.cancel();document.querySelectorAll('.playing').forEach(x=>x.classList.remove('playing'));button.classList.add('playing');active=button;const utterance=new SpeechSynthesisUtterance(text);utterance.lang='ja-JP';utterance.rate=.85;utterance.pitch=1;utterance.onend=utterance.onerror=()=>{button.classList.remove('playing');status.textContent='カードをおすと、ことばが出ます。'};status.textContent=text;speechSynthesis.speak(utterance)}
cards.forEach(([text,color],i)=>{const b=document.createElement('button');b.className='card';b.style.setProperty('--border',color);b.setAttribute('aria-label',text);const img=document.createElement('img');img.src=`cards/card-${String(i+1).padStart(2,'0')}.jpg`;img.alt=text;img.onerror=()=>{img.remove();fallback.style.display='block'};const fallback=document.createElement('span');fallback.className='fallback';fallback.textContent=text;b.append(img,fallback);b.addEventListener('click',()=>speak(text,b));grid.append(b)});
document.getElementById('stop').addEventListener('click',()=>{speechSynthesis.cancel();document.querySelectorAll('.playing').forEach(x=>x.classList.remove('playing'));status.textContent='音をとめました。'});
</script></body></html>
